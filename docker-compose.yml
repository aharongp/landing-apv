version: '3.8'

services:
  apv-catalog:
    build: .
    container_name: apv-auction-catalog
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_KEY=${ADMIN_KEY:-change-me}
      - SESSION_SECRET=${SESSION_SECRET:-use-a-long-random-secret}
      - KOMMO_ENABLED=true
      - KOMMO_SUBDOMAIN=${KOMMO_SUBDOMAIN:-apvmotorusa}
      - KOMMO_TOKEN=${KOMMO_TOKEN}
      - KOMMO_PIPELINE_ID=${KOMMO_PIPELINE_ID:-14370344}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://cars.apvmotorusa.com}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PLUS=${STRIPE_PRICE_PLUS:-}
      - STRIPE_PRICE_PREMIUM=${STRIPE_PRICE_PREMIUM:-}
      - STRIPE_PORTAL_CONFIGURATION=${STRIPE_PORTAL_CONFIGURATION:-}
      - BILLING_INTERVAL=year
      - BILLING_CONSULTATION_CADENCE=period
      - BILLING_FEE_SCOPE=per_vehicle
    volumes:
      - apv_data:/app/data

volumes:
  apv_data:
    driver: local
